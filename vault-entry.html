<!--
  IBQ Vault Entry Overlay
  Purpose: keep this entrance intact while the main website UI is redesigned.
  Integration: place this block immediately after <body> in the final site.
  The ENTER IBQ button removes the overlay and reveals whatever UI is underneath.
-->
<style>
  :root{--ibq-neon:#3dffc8}
  .ibq-entry{position:fixed;inset:0;z-index:9999;background:#05080d;color:#f4f5f7;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;transition:opacity .8s ease,visibility .8s ease;font-family:Outfit,system-ui,sans-serif}
  .ibq-entry.done{opacity:0;visibility:hidden;pointer-events:none}
  .ibq-entry-grid{position:absolute;inset:0;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(circle at center,#000 0%,transparent 80%)}
  .ibq-entry-aura{position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(61,255,200,.16),rgba(61,255,200,.04) 44%,transparent 72%)}
  .ibq-entry-content{position:relative;z-index:2;width:min(100%,540px);text-align:center}
  .ibq-vault-scene{position:relative;width:280px;height:280px;margin:0 auto 24px;perspective:900px;transition:opacity .5s ease,transform .7s ease}
  .ibq-vault-frame{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(61,255,200,.85);box-shadow:0 0 34px rgba(61,255,200,.2),inset 0 0 30px rgba(61,255,200,.08)}
  .ibq-vault-door{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(61,255,200,.18),rgba(20,40,35,.94) 52%,#08100e 78%);border:2px solid var(--ibq-neon);box-shadow:0 0 24px rgba(61,255,200,.25),inset 0 0 40px rgba(61,255,200,.1);transform-origin:12% 50%;transition:transform 1.15s cubic-bezier(.2,.8,.2,1),opacity .8s ease}
  .ibq-vault-door:before{content:"";position:absolute;inset:20px;border-radius:50%;border:1px solid rgba(61,255,200,.42)}
  .ibq-vault-door:after{content:"";position:absolute;inset:39px;border-radius:50%;border:1px dashed rgba(61,255,200,.24)}
  .ibq-vault-hub{position:absolute;left:50%;top:50%;width:90px;height:90px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #75ffd8;background:#0a1513;box-shadow:0 0 24px rgba(61,255,200,.3);transition:transform 1s ease}
  .ibq-vault-hub:before{content:"IBQ";position:absolute;inset:0;display:grid;place-items:center;color:#75ffd8;font-family:Syne,Outfit,system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:.02em}
  .ibq-lockbar{position:absolute;left:50%;top:50%;width:105px;height:7px;background:linear-gradient(90deg,#75ffd8,rgba(117,255,216,.18));border-radius:999px;transform-origin:0 50%;box-shadow:0 0 10px rgba(61,255,200,.25);transition:transform 1s ease}
  .ibq-b1{transform:translateY(-50%) rotate(0deg)}.ibq-b2{transform:translateY(-50%) rotate(90deg)}.ibq-b3{transform:translateY(-50%) rotate(180deg)}.ibq-b4{transform:translateY(-50%) rotate(270deg)}
  .ibq-bolt{position:absolute;width:13px;height:13px;border-radius:50%;background:#75ffd8;box-shadow:0 0 12px rgba(61,255,200,.65)}
  .ibq-bolt.t{top:9px;left:50%;transform:translateX(-50%)}.ibq-bolt.r{right:9px;top:50%;transform:translateY(-50%)}.ibq-bolt.b{bottom:9px;left:50%;transform:translateX(-50%)}.ibq-bolt.l{left:9px;top:50%;transform:translateY(-50%)}
  .ibq-vault-scene.unlock .ibq-vault-hub{transform:translate(-50%,-50%) rotate(135deg)}
  .ibq-vault-scene.unlock .ibq-b1{transform:translateY(-50%) rotate(135deg)}.ibq-vault-scene.unlock .ibq-b2{transform:translateY(-50%) rotate(225deg)}.ibq-vault-scene.unlock .ibq-b3{transform:translateY(-50%) rotate(315deg)}.ibq-vault-scene.unlock .ibq-b4{transform:translateY(-50%) rotate(405deg)}
  .ibq-vault-scene.open .ibq-vault-door{transform:rotateY(-102deg) translateX(-12px);opacity:.3}.ibq-vault-scene.open{transform:scale(1.08)}
  .ibq-orb-wrap{display:none;position:relative;width:220px;height:220px;margin:0 auto 28px;place-items:center;opacity:0;transform:scale(.7);transition:opacity .6s ease,transform .7s ease}
  .ibq-orb-wrap.show{display:grid;opacity:1;transform:scale(1)}
  .ibq-ring{position:absolute;border-radius:50%;border:1px solid rgba(61,255,200,.55)}
  .ibq-r1{inset:0;border-top-color:#75ffd8;animation:ibqSpin 3s linear infinite}.ibq-r2{inset:18px;border-right-color:#75ffd8;animation:ibqSpinReverse 2.1s linear infinite}.ibq-r3{inset:38px;border-bottom-color:#75ffd8;opacity:.75;animation:ibqSpin 4.4s linear infinite}
  .ibq-core{width:120px;height:120px;border-radius:30px;border:1px solid rgba(117,255,216,.9);display:grid;place-items:center;box-shadow:0 0 35px rgba(61,255,200,.2),inset 0 0 28px rgba(61,255,200,.08)}
  .ibq-core-logo{font-family:Syne,Outfit,system-ui,sans-serif;font-weight:800;font-size:42px;letter-spacing:-.08em;color:#75ffd8;margin-left:-4px}
  .ibq-entry-eyebrow{font-size:11px;letter-spacing:.38em;color:#9da6b4;text-transform:uppercase;margin-bottom:10px}
  .ibq-entry h2{font-family:Syne,Outfit,system-ui,sans-serif;font-size:clamp(24px,5vw,38px);line-height:1.08;font-weight:700;margin:0;color:#f7fafc}
  .ibq-entry-status{margin:16px auto 22px;color:#9da6b4;font-size:14px;min-height:22px}
  .ibq-entry-progress{width:min(320px,82%);height:3px;margin:0 auto 26px;background:rgba(255,255,255,.09);overflow:hidden;border-radius:999px;opacity:0;transition:opacity .4s ease}
  .ibq-entry-progress.show{opacity:1}.ibq-entry-bar{height:100%;width:0;background:#75ffd8;box-shadow:0 0 12px rgba(61,255,200,.7);transition:width .35s ease}
  .ibq-enter{min-height:50px;border:1px solid rgba(117,255,216,.85);border-radius:999px;padding:0 30px;background:#75ffd8;color:#05100d;font-weight:800;letter-spacing:.12em;cursor:pointer;opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:.45s ease;box-shadow:0 0 26px rgba(61,255,200,.2)}
  .ibq-enter.ready{opacity:1;transform:none;pointer-events:auto}.ibq-skip{display:block;margin:18px auto 0;border:0;background:transparent;color:#687485;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
  @keyframes ibqSpin{to{transform:rotate(360deg)}}@keyframes ibqSpinReverse{to{transform:rotate(-360deg)}}
  @media(prefers-reduced-motion:reduce){.ibq-ring{animation:none!important}.ibq-entry *{transition:none!important}}
</style>

<div id="ibqEntry" class="ibq-entry" aria-label="IBQ Websites vault entrance">
  <div class="ibq-entry-grid"></div><div class="ibq-entry-aura"></div>
  <div class="ibq-entry-content">
    <div id="ibqVault" class="ibq-vault-scene" aria-hidden="true">
      <div class="ibq-vault-frame"></div>
      <div class="ibq-vault-door">
        <div class="ibq-lockbar ibq-b1"></div><div class="ibq-lockbar ibq-b2"></div><div class="ibq-lockbar ibq-b3"></div><div class="ibq-lockbar ibq-b4"></div>
        <div class="ibq-bolt t"></div><div class="ibq-bolt r"></div><div class="ibq-bolt b"></div><div class="ibq-bolt l"></div><div class="ibq-vault-hub"></div>
      </div>
    </div>
    <div id="ibqOrb" class="ibq-orb-wrap" aria-hidden="true">
      <div class="ibq-ring ibq-r1"></div><div class="ibq-ring ibq-r2"></div><div class="ibq-ring ibq-r3"></div>
      <div class="ibq-core"><div class="ibq-core-logo">IBQ</div></div>
    </div>
    <div class="ibq-entry-eyebrow">I Build Quality Websites</div>
    <h2 id="ibqHeadline">Secure access detected</h2>
    <div id="ibqStatus" class="ibq-entry-status" aria-live="polite">Preparing the vault...</div>
    <div id="ibqProgress" class="ibq-entry-progress"><div id="ibqBar" class="ibq-entry-bar"></div></div>
    <button id="ibqEnterBtn" class="ibq-enter" type="button">ENTER IBQ</button>
    <button id="ibqSkipBtn" class="ibq-skip" type="button">Skip intro</button>
  </div>
</div>

<script>
(function(){
  const entry=document.getElementById('ibqEntry'),vault=document.getElementById('ibqVault'),orb=document.getElementById('ibqOrb'),headline=document.getElementById('ibqHeadline'),status=document.getElementById('ibqStatus'),progress=document.getElementById('ibqProgress'),bar=document.getElementById('ibqBar'),enter=document.getElementById('ibqEnterBtn'),skip=document.getElementById('ibqSkipBtn');
  if(!entry||!vault||!orb||!headline||!status||!progress||!bar||!enter||!skip)return;
  let timers=[];
  function revealReady(){headline.textContent='Your vision starts here.';status.textContent='Access unlocked.';enter.classList.add('ready');skip.style.visibility='hidden'}
  function afterVault(){vault.style.display='none';orb.classList.add('show');progress.classList.add('show');headline.textContent='Initializing your experience';status.textContent='Connecting to IBQ...';[[20,'Connecting to IBQ...'],[42,'Loading visual systems...'],[66,'Preparing interactive experience...'],[85,'Quality check complete...'],[100,'Access unlocked.']].forEach((s,i)=>timers.push(setTimeout(()=>{bar.style.width=s[0]+'%';status.textContent=s[1];if(i===4)revealReady()},300+i*430)))}
  function skipAll(){timers.forEach(clearTimeout);timers=[];vault.style.display='none';orb.classList.add('show');progress.classList.add('show');bar.style.width='100%';revealReady()}
  function openSite(){entry.classList.add('done');setTimeout(()=>entry.remove(),900)}
  enter.addEventListener('click',openSite);skip.addEventListener('click',skipAll);
  status.textContent='Verifying access...';
  timers.push(setTimeout(()=>{vault.classList.add('unlock');status.textContent='Vault unlocking...'},700));
  timers.push(setTimeout(()=>{vault.classList.add('open');status.textContent='Access granted.'},1850));
  timers.push(setTimeout(afterVault,2850));
})();
</script>
